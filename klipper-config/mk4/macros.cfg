# ----------------------------------------------------------------------------
#  Sonda de despliegue MANUAL.
#  G28 (con Z) y BED_MESH_CALIBRATE se niegan a sondear hasta que confirmas
#  que el brazo está abajo (botón "Listo" del diálogo o comando SONDA_LISTA).
#  Al terminar piden recogerlo; PRINT_START no arranca con la sonda abajo.
#  PROBE / PROBE_CALIBRATE / PROBE_ACCURACY no están envueltos: SONDA_LISTA antes.
# ----------------------------------------------------------------------------
[gcode_macro _SONDA]
# pending: 0 nada, 1 G28 Z (X/Y ya homeados), 2 malla
variable_deployed: False
variable_pending: 0
gcode:

[gcode_macro _SONDA_PEDIR]
gcode:
  SET_GCODE_VARIABLE MACRO=_SONDA VARIABLE=pending VALUE={params.ACCION|default(0)|int}
  RESPOND TYPE=command MSG="action:prompt_begin Sonda Z"
  RESPOND TYPE=command MSG="action:prompt_text Baja el brazo de la sonda y pulsa Listo."
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancelar|_SONDA_CANCELAR"
  RESPOND TYPE=command MSG="action:prompt_footer_button Listo|SONDA_LISTA|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND MSG="Sonda no confirmada: despliega el brazo y ejecuta SONDA_LISTA"

[gcode_macro _SONDA_RECOGER]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Sonda Z"
  RESPOND TYPE=command MSG="action:prompt_text Sondeo terminado. SUBE el brazo antes de imprimir (si vas a hacer malla, cierra este aviso)."
  RESPOND TYPE=command MSG="action:prompt_footer_button Recogida|SONDA_GUARDADA|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SONDA_CANCELAR]
gcode:
  SET_GCODE_VARIABLE MACRO=_SONDA VARIABLE=pending VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro SONDA_LISTA]
description: Confirma sonda DESPLEGADA y reanuda el homing/malla pendiente
gcode:
  {% set pending = printer["gcode_macro _SONDA"].pending %}
  SET_GCODE_VARIABLE MACRO=_SONDA VARIABLE=deployed VALUE=True
  SET_GCODE_VARIABLE MACRO=_SONDA VARIABLE=pending VALUE=0
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if pending == 1 %}
    G28 Z
  {% elif pending == 2 %}
    BED_MESH_CALIBRATE
  {% endif %}

[gcode_macro SONDA_GUARDADA]
description: Confirma sonda RECOGIDA
gcode:
  SET_GCODE_VARIABLE MACRO=_SONDA VARIABLE=deployed VALUE=False
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="Sonda recogida"

# X/Y SIN finales de carrera (retirados 2026-11-21): homing por choque con el
# ADXL (HOME_ACCEL, extras/accel_endstop.py). Z sigue con la sonda vía
# safe_z_home (G28.1 Z). G28.1 X/Y NO se debe usar: busca los interruptores.
[gcode_macro _XY_HOP]
description: Separa boquilla y cama antes de mover X/Y (como el z_hop de safe_z_home)
gcode:
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G91
    G1 Z5 F600
    G90
    M400
    SET_KINEMATIC_POSITION CLEAR_HOMED=Z
  {% elif printer.toolhead.position.z < 5 %}
    G90
    G1 Z5 F600
  {% endif %}

[gcode_macro G28]
rename_existing: G28.1
gcode:
  {% set raw = rawparams|upper %}
  {% set all = 'X' not in raw and 'Y' not in raw and 'Z' not in raw %}
  {% set hx = all or 'X' in raw %}
  {% set hy = all or 'Y' in raw %}
  {% set hz = all or 'Z' in raw %}
  {% if hx or hy %}
    _XY_HOP
    HOME_ACCEL AXIS={"X" if hx else ""}{"Y" if hy else ""}
  {% endif %}
  {% if hz %}
    {% if printer["gcode_macro _SONDA"].deployed %}
      G28.1 Z
      _SONDA_RECOGER
    {% else %}
      _SONDA_PEDIR ACCION=1
    {% endif %}
  {% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
  {% if printer["gcode_macro _SONDA"].deployed %}
    _BED_MESH_CALIBRATE_BASE {rawparams}
    _SONDA_RECOGER
  {% else %}
    _SONDA_PEDIR ACCION=2
  {% endif %}

# ----------------------------------------------------------------------------
#  Inicio / fin de impresión.  Cura -> Start: PRINT_START EXTRUDER={material_print_temperature_layer_0}
#                              Cura -> End:   PRINT_END
#  Homing manual previo (como en Marlin): PRINT_START no hace G28.
# ----------------------------------------------------------------------------
[gcode_macro PRINT_START]
description: Comprueba homing y sonda, carga malla, calienta y purga
gcode:
  {% set temp = params.EXTRUDER|default(200)|float %}
  {% if printer["gcode_macro _SONDA"].deployed %}
    {action_raise_error("Sonda desplegada: subela y ejecuta SONDA_GUARDADA")}
  {% endif %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_raise_error("Sin homing: haz G28 (con la sonda) antes de imprimir")}
  {% endif %}
  CLEAR_PAUSE
  {% if 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
  {% endif %}
  G90
  G1 Z10 F600
  M109 S{temp}
  G1 X5 Y5 F6000
  G1 Z0.3 F600
  G92 E0
  G1 X80 E6 F1200
  G92 E0
  G1 Z2 F600

[gcode_macro PRINT_END]
description: Retrae, baja la cama, aparca y apaga
gcode:
  {% set th = printer.toolhead %}
  M400
  G92 E0
  G1 E-2 F1800
  G90
  G1 Z{[th.position.z + 10, th.axis_maximum.z]|min} F600
  G1 X{th.axis_minimum.x + 5} Y{th.axis_minimum.y + 5} F6000
  TURN_OFF_HEATERS
  M107
  M84

# ----------------------------------------------------------------------------
#  M907 compatible con Marlin (mA). X e Y comparten canal (_vref_xy).
#  Ajuste en caliente con la misma sintaxis que en Marlin; sin parámetros
#  solo informa. Única vía de ajuste: los pines están ocultos en Mainsail.
# ----------------------------------------------------------------------------
[gcode_macro M907]
description: Corriente de motores en mA (X=XY, Z, E), tope 1500 mA
gcode:
  {% for axis, pin in [('X', '_vref_xy'), ('Y', '_vref_xy'), ('Z', '_vref_z'), ('E', '_vref_e')] %}
    {% if axis in params %}
      SET_PIN PIN={pin} VALUE={[params[axis]|float / 1000, 1.5]|min}
    {% endif %}
  {% endfor %}
  _CORRIENTE_INFORME

# Macro aparte: se evalúa después de SET_PIN y muestra los valores nuevos
[gcode_macro _CORRIENTE_INFORME]
gcode:
  {% set out = [] %}
  {% for axis, pin in [('XY', '_vref_xy'), ('Z', '_vref_z'), ('E', '_vref_e')] %}
    {% set obj = 'output_pin ' ~ pin %}
    {% set scale = printer.configfile.settings[obj].scale %}
    {% set _ = out.append(axis ~ '=' ~ (printer[obj].value * scale * 1000)|round|int ~ ' mA') %}
  {% endfor %}
  RESPOND MSG="Corriente motores: {out|join(', ')}"
