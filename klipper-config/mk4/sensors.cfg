# ============================================================================
#  sensors.cfg — Raspberry Pi 4 como 2ª MCU (proceso klipper_mcu)
#  Requiere: dtparam=spi=on + dtoverlay=dht11,gpiopin=4 en /boot/firmware/config.txt
#  y el servicio klipper-mcu instalado (docs/12 §4).
# ============================================================================

[mcu rpi]
serial: /tmp/klipper_host_mcu

# ----------------------------------------------------------------------------
#  Acelerómetros ADXL345 en SPI0 de la Pi (SCLK/MOSI/MISO compartidos)
#    cabezal -> CE0 (GPIO8, pin 24) = spidev0.0
#    cama    -> CE1 (GPIO7, pin 26) = spidev0.1
#  Montar ambos con sus ejes alineados a los de la impresora, o corregir axes_map.
#  Cable largo al cabezal: si salen errores, bajar spi_speed (p.ej. 2000000).
#
#  Los módulos de 10 pines que tenemos traen el SDO del chip soldado a GND
#  (placa "solo I2C"): por SPI normal no devuelven nada. Se usan en SPI de
#  3 hilos con extras/adxl345_3w.py: MISO (pin 21) directo a SDA y MOSI
#  (pin 19) a SDA por 1 kΩ; SDO del módulo suelto (docs/12 §3).
#
#  EN USO (2026-11-20): por I2C con extras/adxl345_i2c.py, 4 hilos:
#  5V/Vin -> pin 2, GND -> pin 6, SDA -> pin 3, SCL -> pin 5; CS/SDO/VS sueltos
#  (dir. 0x53). Lee la Pi a 800 Hz (789 Hz reales; tiempos menos precisos que
#  SPI, válido para el shaper).
# ----------------------------------------------------------------------------
[adxl345_i2c cabezal]
i2c_bus: 1
i2c_address: 83         # 0x53
rate: 800
# Montado invertido en Z: X impresora = -X chip, Y = Y, Z = -Z (Antonio, 2026-11-20).
# Verificado moviendo +X/+Y (este Klipper no tiene AXES_MAP_CALIBRATION, docs/12 §7).
axes_map: -x, y, -z

# Con la resistencia: quitar [adxl345_i2c cabezal], descomentar esto y
# cambiar accel_chip en [resonance_tester].
#[adxl345_3w cabezal]
#cs_pin: rpi:None
#spi_bus: spidev0.0
#spi_speed: 2000000      # la resistencia de 1 kΩ suaviza los flancos de SDA
#axes_map: -x, y, -z

# Sin cablear todavía (2026-11-20): de momento solo el del cabezal.
#[adxl345_3w cama]
#cs_pin: rpi:None
#spi_bus: spidev0.1
#axes_map: x, y, z

[resonance_tester]
# X e Y mueven el CABEZAL (la cama solo sube/baja): ambos ejes con el del cabezal.
# El de la cama se usa con CHIPS=... para medir cuánto vibra el chasis (docs/12 §7).
accel_chip: adxl345_i2c cabezal
probe_points:
    95, 120, 20

# EXPERIMENTO (2026-11-21): detectar el choque de X/Y contra el tope con el
# ADXL (interrupción de actividad, INT1 -> pin 11 / GPIO17). Comandos
# HOME_ACCEL [AXIS=X|Y] y ACCEL_CRASH_TEST AXIS=X|Y. El choque del carro con el
# marco = position_endstop de [stepper_x]/[stepper_y]. El G28 normal sigue
# esperando los finales de carrera físicos (retirados para la prueba).
[accel_endstop]
accel_chip: adxl345_i2c cabezal
int_pin: rpi:gpio17
threshold_x: 3.0        # g. Libre a 15 mm/s: 1.5 salta, 2 no; choque detectado a +0.013 mm (1 paso)
threshold_y: 1.5        # g. Choque blando (2 correas): 1.5 → 5/5 a 0.000 mm; 2-3 g detecta tarde. Libre: 1.25 no salta
speed: 15               # mm/s hacia el marco
blank_time: 0.1         # s tras arrancar el movimiento antes de armar INT1
backoff: 5              # mm de separación antes de buscar el choque
retract: 3              # mm de retroceso tras el choque
overtravel: 6           # mm más allá de position_endstop antes de rendirse

# Rellenar con el resultado de SHAPER_CALIBRATE (o dejar que SAVE_CONFIG lo escriba)
#[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 40
#shaper_type_y: mzv
#shaper_freq_y: 40

# ----------------------------------------------------------------------------
#  Ambiente: módulo DHT11/DHT22 de 3 pines en GPIO4 (pin 7), alimentado a 3.3 V.
#  Klipper NO soporta DHT de serie -> extras/dht_iio.py (lee el driver del kernel).
#  [dht_iio] DEBE ir antes que los temperature_sensor que lo usan.
# ----------------------------------------------------------------------------
#  Sin cablear todavía (2026-11-20): activar junto con dtoverlay=dht11 y el enlace de extras/.
#[dht_iio]
#
#[temperature_sensor ambiente]
#sensor_type: DHT_IIO
#min_temp: -10
#max_temp: 70
#
#[temperature_sensor humedad]    # se grafica como "°C" pero el valor es %HR
#sensor_type: DHT_IIO
#dht_value: humidity
#min_temp: 0
#max_temp: 100

# ----------------------------------------------------------------------------
#  Temperaturas internas (gratis, útil para vigilar la electrónica)
# ----------------------------------------------------------------------------
[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor robin_lite]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90
