# ============================================================================
#  printer.cfg — MK4 (placa MKS Robin Lite reciclada de la K9) bajo Klipper
#  Host: Raspberry Pi 4B. Ver docs/12-mk4-klipper.md ANTES de aplicar potencia.
#
#  Copia esta carpeta (printer.cfg + *.cfg) a ~/printer_data/config/
#  Valores de partida = EEPROM Marlin MK3 (M503 del 2026-08-17). Marcados
#  VERIFICAR: comprobar en máquina antes de fiarse.
# ============================================================================

[include mainsail.cfg]    # macros PAUSE/RESUME/CANCEL (enlace creado por KIAUH)
[include sensors.cfg]     # Pi como 2ª MCU: ADXL345 cabezal (input shaper + homing X/Y por choque)
[include macros.cfg]      # Sonda manual, PRINT_START/END, M907

# ============================================================================
#  MCU principal: MKS Robin Lite (STM32F103RC, CH340 en USART1)
# ============================================================================
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0   # VERIFICAR: ls /dev/serial/by-id/*
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
# Arranque conservador. Subir SOLO tras input shaping (docs/12 §7).
max_velocity: 150
max_accel: 2500          # input shaper 2026-11-20: Y 2hump_ei admite <=2900 (docs/12 §7.1)
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 100

# ============================================================================
#  Corriente de motores: los A4988 de esta placa toman Vref de un PWM filtrado
#  (equivale a M907 de Marlin). value/SET_PIN en AMPERIOS gracias a 'scale'.
#  Marlin: duty = 255*mA/1985.76 sobre 255 ticks (RANGE 65535/10/3.3,
#  preload 254) -> scale = 1.986 da el mismo duty (+0.05..0.7 %, verificado).
#  Los 3 pines van en TIM3: misma cycle_time obligatoria.
#  Prefijo "_": Mainsail los oculta (su slider llega a 100 % = ~2 A).
#  Ajustar SOLO con M907 en mA (macros.cfg, tope 1500 mA); M907 sin
#  parámetros informa los valores actuales.
# ============================================================================
[output_pin _vref_xy]      # X y Y comparten canal (Y lleva 2 motores en paralelo)
pin: PB0
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 0.85

[output_pin _vref_z]       # 2 motores Z en un solo driver
pin: PA7
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 1.2

[output_pin _vref_e]
pin: PA6
pwm: True
hardware_pwm: True
cycle_time: 0.0001
scale: 1.986
value: 0.8

# ============================================================================
#  Ejes. Pasos/mm Marlin -> rotation_distance = 200*16 / pasos_mm
#  (A4988 a 1/16 fijo; full_steps=200 da exactamente los mismos pasos/mm).
#  ENABLE compartido PB10 en X/Y/Z (soportado por Klipper).
#  Origen 0,0 = esquina del plato: sustituye a M206 X-40 Y-60 de Marlin.
# ============================================================================
[stepper_x]
step_pin: PC6
dir_pin: !PB12                  # INVERT_X_DIR true. VERIFICAR con jog
enable_pin: !PB10
microsteps: 16
rotation_distance: 42.667       # 75 pasos/mm
endstop_pin: ^!PC13             # interruptor RETIRADO (2026-11-21): homing X con HOME_ACCEL (macros.cfg)
position_endstop: -40           # = choque del carro con el marco (lo usa HOME_ACCEL)
position_min: -40
position_max: 310               # recorrido 350 - 40. VERIFICAR
homing_speed: 30
second_homing_speed: 3
homing_retract_dist: 3

[stepper_y]                     # 2 motores en paralelo en el driver Y
step_pin: PB11
dir_pin: !PB2                   # INVERT_Y_DIR true. VERIFICAR con jog
enable_pin: !PB10
microsteps: 16
rotation_distance: 42.667       # 75 pasos/mm
endstop_pin: ^!PC0              # interruptor RETIRADO (2026-11-21): homing Y con HOME_ACCEL (macros.cfg)
position_endstop: -60           # = choque del carro con el marco (lo usa HOME_ACCEL)
position_min: -60
position_max: 320               # recorrido 380 - 60. VERIFICAR
homing_speed: 30
second_homing_speed: 3
homing_retract_dist: 3

[stepper_z]                     # cama levadiza, 2 brazos K9 en un driver
step_pin: PB1
dir_pin: PC5                    # INVERT_Z_DIR false. VERIFICAR: Z+ ALEJA la cama
enable_pin: !PB10
microsteps: 16
rotation_distance: 5.2805       # 606 pasos/mm
endstop_pin: probe:z_virtual_endstop
position_min: -2                # margen para PROBE_CALIBRATE
position_max: 110
homing_speed: 5
second_homing_speed: 2

# ============================================================================
#  Extrusor + hotend (cabezal K9)
# ============================================================================
[extruder]
step_pin: PC4
dir_pin: !PA5                   # INVERT_E0_DIR true. VERIFICAR
enable_pin: !PA4
microsteps: 16
rotation_distance: 3.0769       # 1040 pasos/mm
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100
max_extrude_only_velocity: 60
max_extrude_only_accel: 300
pressure_advance: 0.08          # M900 K0.08. Re-afinar
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F   # TEMP_SENSOR_0 = 1
sensor_pin: PA0
control: pid                    # M301 de Marlin; re-calibrar: PID_CALIBRATE
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 270
min_extrude_temp: 170

[fan]                           # ventilador de capa
pin: PA8
kick_start_time: 0.5

# PA1 (TEMP_BED) y PC8 (HEATER_BED) libres: MK4 sin cama caliente.

# ============================================================================
#  Sonda Z: brazo basculante de despliegue MANUAL en conector Z_MAX (PB9)
#  Polaridad verificada en Marlin: contacto = HIGH = triggered.
#  El flujo de despliegue/recogida está en macros.cfg (G28 la exige).
# ============================================================================
[probe]
pin: ^PB9                       # = Marlin Z_MIN_PROBE_PIN Z_MAX_PIN, PROBE_ENDSTOP_INVERTING false + pullup
x_offset: -12                   # M851 X-12
y_offset: -10                   # M851 Y-10
z_offset: 0.70                  # M851 Z-0.70 -> re-calibrar: PROBE_CALIBRATE
speed: 4
lift_speed: 10
samples: 3                      # sonda de baja calidad (MULTIPLE_PROBING 3)
sample_retract_dist: 2
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 95, 120       # centro del plato 190×240. VERIFICAR
z_hop: 5
z_hop_speed: 10
speed: 50

[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 10, 10                # coordenadas de SONDA, no de boquilla
mesh_max: 175, 225
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

# ============================================================================
#  Varios
# ============================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
[pause_resume]
[respond]
[exclude_object]                # cancelar objeto nativo (sustituye a BoostKit)

[gcode_arcs]
resolution: 0.5

[force_move]                    # SET_KINEMATIC_POSITION para pruebas sin homing
enable_force_move: True

[idle_timeout]
timeout: 1800

# ============================================================================
#  Tras PID_CALIBRATE / PROBE_CALIBRATE / SHAPER_CALIBRATE Klipper añade aquí
#  un bloque #*# SAVE_CONFIG. No editarlo a mano.
# ============================================================================

